<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse & Delivery Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h2>🏗️ W&D System</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" onclick="showPage('dashboard')" class="active"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="#" onclick="showPage('inbound')"><i class="fas fa-arrow-down"></i> Inbound</a></li>
                <li><a href="#" onclick="showPage('outbound')"><i class="fas fa-arrow-up"></i> Outbound</a></li>
                <li><a href="#" onclick="showPage('inventory')"><i class="fas fa-boxes"></i> Inventory</a></li>
                <li><a href="#" onclick="showPage('delivery')"><i class="fas fa-truck"></i> Delivery</a></li>
                <li><a href="#" onclick="showPage('warehouse')"><i class="fas fa-warehouse"></i> Warehouse</a></li>
                <li><a href="#" onclick="showPage('reports')"><i class="fas fa-file-alt"></i> Reports</a></li>
                <li><a href="#" onclick="showPage('settings')"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main id="main-content">
            <header class="header">
                <div class="header-title">
                    <h1 id="page-title">Dashboard</h1>
                </div>
                <div class="header-actions">
                    <button onclick="logout()" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </header>

            <div id="page-content">
                <!-- Pages will be loaded here -->
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/inbound.js"></script>
    <script src="js/outbound.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/delivery.js"></script>
    <script src="js/warehouse.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
